name: Windows build and release

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Determine archive version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            $version = $env:REF_NAME
            if ($version -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$') {
              throw 'Use vX.Y.Z or vX.Y.Z-rc.N / -beta.N / -alpha.N.'
            }
          } else {
            $version = 'dev-' + $env:GITHUB_SHA.Substring(0, 7)
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare FFmpeg for tests only
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows application
        run: |
          python -m PyInstaller --clean --noconfirm transcribe.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check packaged application startup
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'transcribe-smoke.json'
          $exe = Join-Path $PWD 'dist/Transcribe/Transcribe.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', "`"$report`"") -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Packaged application startup timed out.'
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $report)) {
            throw 'Packaged application startup failed.'
          }
          Get-Content -LiteralPath $report

      - name: Collect third-party licenses
        run: |
          python collect_licenses.py --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package ZIP and SHA-256
        env:
          ARCHIVE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/package_release.py --version $env:ARCHIVE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Transcribe-${{ steps.version.outputs.version }}-win-x64
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Transcribe-${{ needs.build.outputs.version }}-win-x64
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag --generate-notes \
            --title "Transcribe $RELEASE_TAG" "${flags[@]}"
